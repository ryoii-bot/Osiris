name: Windows

# Windows x64 Release build only.
#
# The build output (Osiris.dll) is uploaded as a workflow artifact, so it can be
# downloaded from the run page (Actions -> run -> Artifacts) after the build.
#
# Two ways to start a build:
#   * push a commit / open a pull request
#   * Actions -> Windows -> Run workflow (manual trigger)
#
# Everything that is disabled is kept below as a comment on purpose. Uncomment a
# block to re-enable it (extra runners, toolsets, configurations, CMake build,
# tests). Note: if several jobs upload an artifact in the same run, give each
# artifact a distinct `name:`.

on: [push, pull_request, workflow_dispatch]

jobs:
  msbuild:
    runs-on: windows-2022
    # Disabled: build the whole original matrix (windows-2025, ClangCL, Debug)
    # strategy:
    #   matrix:
    #     os: [windows-2022, windows-2025]
    #     toolset: [ClangCL, MSVC]
    #     configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    # Disabled: ClangCL toolset
    # - name: Set toolset
    #   if: matrix.toolset == 'ClangCL'
    #   run: echo "toolset=/p:PlatformToolset=${{ matrix.toolset }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Build
      shell: cmd
      run: msbuild Osiris.sln /p:Platform=x64 /p:Configuration=Release
    - name: Locate build output
      shell: pwsh
      run: Get-ChildItem -Path . -Recurse -File -Filter Osiris.dll | Select-Object -ExpandProperty FullName
    - name: Upload build artifact
      uses: actions/upload-artifact@v5
      with:
        name: Osiris-windows-x64-Release
        path: '**/Osiris.dll'
        if-no-files-found: error

